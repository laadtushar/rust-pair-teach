name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Enforces the one architectural promise nothing else would notice breaking:
      # src/core must never import `vscode`, or the future sidecar extraction becomes a rewrite.
      - name: Core boundary + lint
        run: npm run lint

      - name: Unit, replay and contract tests
        run: npm test

      - name: Bundle
        run: npm run build

      # Catches what nothing else would: files leaking into the published artifact. The harness,
      # CLAUDE.md and a dev script had all been shipping to end users before this existed.
      - name: Published package contents
        run: ./scripts/check-package-contents.sh

  # The panel, rendered in a real browser. Separate because it downloads a Chromium, and because a
  # rendering failure should be distinguishable at a glance from a logic failure.
  webview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Escaping, the CSP nonce, and the claim that a half-typed message survives a streaming
      # re-render. None of it is checkable from a string comparison.
      - name: Panel rendering tests
        run: npm run test:webview

  # Separate job: it downloads a real VS Code and needs a virtual display, so a failure here
  # should be distinguishable at a glance from a unit-test failure.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The only test that answers "does the extension actually activate". Everything else in this
      # repository runs against a stub.
      - name: Integration tests in real VS Code
        run: xvfb-run -a npm run test:integration

  # Asks the real Ruff extension what it puts in `Diagnostic.code`, rather than trusting a reading
  # of its source. Separate from `integration` because that run uses --disable-extensions on
  # purpose, and separate from `verify` because it reaches the Marketplace.
  #
  # continue-on-error: a Marketplace outage must not turn the build red. Its result is evidence
  # about someone else's tool, not a gate on this one — but a real regression still shows up as a
  # failed job rather than as silence.
  analyzer:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ask Ruff directly
        run: xvfb-run -a npm run test:analyzer

# Deliberately not here:
#   - model conformance (costs money, nondeterministic) — manually triggered, see
#     docs/engineering-plan.md §3.4
#   - Marketplace publish — tag-triggered only, never on a PR
