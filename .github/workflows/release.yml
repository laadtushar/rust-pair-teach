name: Release

on:
  push:
    tags: ['v*']
  # Also dispatchable: session git credentials can push branches but not tags (403), so the
  # workflow is able to create the tag itself from a version input.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag and release, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve tag
        id: tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the tag matches package.json
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${{ steps.tag.outputs.name }}" ]; then
            echo "tag ${{ steps.tag.outputs.name }} does not match package.json ($PKG)" >&2
            exit 1
          fi

      - run: npm ci

      # A tag never ships without passing the same gates a pull request does.
      - name: Verify
        run: npm run verify

      - name: Package
        run: npm run build && npm run package

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.tag.outputs.name }}" -m "${{ steps.tag.outputs.name }}"
          git push origin "${{ steps.tag.outputs.name }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" \
            --title "${{ steps.tag.outputs.name }}" \
            --generate-notes \
            ./*.vsix
